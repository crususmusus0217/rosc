[package]
name = "rosc"
version = "0.1.0"
edition = "2024"
description = "ROSC — Return Of Spontaneous Circulation (Bevy perfusion sim scaffold)"
license = "MIT"
publish = false

[dependencies]
bevy = { version = "0.19.1", features = ["dynamic_linking"] }
nalgebra = "0.33"
nalgebra-sparse = "0.10"

# 自分のコードは最適化なし（ブレークポイントが確実に効く）
[profile.dev]
opt-level = 0

# 依存（Bevy 本体）は最適化を維持 → 実行速度は保てる
[profile.dev.package."*"]
opt-level = 3
